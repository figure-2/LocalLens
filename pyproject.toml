[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "locallens"
version = "0.1.0"
description = "Local-first multimodal retrieval engine for selected folders."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.128.0",
    "psycopg[binary,pool]>=3.2.0",
    "qdrant-client>=1.10.0",
    "pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "pdfplumber>=0.11.0",
    "sentence-transformers>=2.7.0",
    "sentencepiece>=0.2.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
]
local-vlm = [
    "einops>=0.8.0",
    "num2words>=0.5.14",
    "timm>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["locallens*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
